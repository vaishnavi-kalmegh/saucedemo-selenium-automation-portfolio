[pytest]
minversion = 8.0
addopts = -ra --strict-markers --html=reports/report.html --self-contained-html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    login: Login and authentication scenarios
    cart: Shopping cart scenarios
    checkout: Checkout scenarios
    inventory: Product listing, sorting, and product detail scenarios
    session: Logout, protected pages, and app-state reset scenarios
